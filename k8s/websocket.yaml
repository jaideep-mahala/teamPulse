apiVersion: v1
kind: Service
metadata:
  name: websocket
  namespace: teampulse
spec:
  selector:
    app: websocket
  ports:
    - name: websocket
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: teampulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket
  template:
    metadata:
      labels:
        app: websocket
    spec:
      containers:
        - name: websocket
          image: 900532378485.dkr.ecr.us-west-2.amazonaws.com/teampulse-websocket:00da329
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 5000
          env:
            - name: WS_PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teampulse-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: teampulse-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              value: "redis://redis:6379"
          readinessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
